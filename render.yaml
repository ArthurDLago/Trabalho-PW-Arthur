# Blueprint do Render: cria o banco PostgreSQL, a API (Express) e o frontend (React) de uma vez.
# Render > New > Blueprint > selecione o repositório.
# Depois: 1) rode o banco/criar-tabelas.sql no banco criado (veja o README);
#         2) copie a URL da API e cole em REACT_APP_API_URL do frontend (e faça redeploy).
databases:
  - name: oficina-db
    plan: free
    databaseName: oficina

services:
  - type: web
    name: oficina-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oficina-db
          property: connectionString

  - type: web
    name: oficina-pwa
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://oficina-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
